<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="100%" height="100%">
    <defs>
        <!-- Arrowhead Marker -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#6B7280" />
        </marker>
        <!-- Subtle Drop Shadow for Boxes -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.06" flood-color="#000000" />
        </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="100%" height="100%" fill="#F8FAFC" />

    <!-- Header Section -->
    <text x="70" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="44px" font-weight="800" fill="#111827">AI_Powered Sustainable Manufacturing Optimization</text>
    <text x="70" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="24px" fill="#4B5563">From raw industrial data to forecasts, anomaly monitoring, optimization, API, and public dashboard</text>

    <!-- ======================= -->
    <!--     CONNECTOR LINES     -->
    <!-- ======================= -->
    <g fill="none" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrow)">
        <!-- Row 1 to Row 2 -->
        <path d="M 205 210 L 205 230 L 505 230 L 505 246" />
        <path d="M 505 210 L 505 246" />
        <path d="M 815 210 L 815 230 L 505 230 L 505 246" />
        
        <!-- Row 2 to Row 3 -->
        <path d="M 505 330 L 505 366" />
        
        <!-- Row 3 to Row 4 (Split to EDA and Training) -->
        <path d="M 505 450 L 505 470 L 225 470 L 225 486" />
        <path d="M 505 450 L 505 470 L 660 470 L 660 486" />
        
        <!-- Row 4 to Row 5 (Training Pipeline Split) -->
        <path d="M 660 570 L 660 590 L 230 590 L 230 606" />
        <path d="M 660 570 L 660 606" />
        <path d="M 660 570 L 660 590 L 930 590 L 930 606" />
        
        <!-- Row 5 to Row 6 (Merge into Reports) -->
        <path d="M 230 690 L 230 710 L 550 710 L 550 726" />
        <path d="M 660 690 L 660 700 L 550 700 L 550 726" />
        <path d="M 930 690 L 930 710 L 550 710 L 550 726" />
        
        <!-- Row 6 to Row 7 (Split to Apps) -->
        <path d="M 550 810 L 550 830 L 335 830 L 335 846" />
        <path d="M 550 810 L 550 830 L 790 830 L 790 846" />
    </g>

    <!-- ======================= -->
    <!--     PIPELINE BOXES      -->
    <!-- ======================= -->
    <g font-family="system-ui, -apple-system, sans-serif">
        <!-- Row 1: Data Sources -->
        <rect x="70" y="130" width="270" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#EFF6FF" stroke="#93C5FD" />
        <text x="90" y="165" font-size="22px" font-weight="700" fill="#111827">🛢️ TEC_48S.zip</text>
        <text x="90" y="190" font-size="18px" fill="#4B5563">Machine sensor readings</text>

        <rect x="370" y="130" width="270" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#EFF6FF" stroke="#93C5FD" />
        <text x="390" y="165" font-size="22px" font-weight="700" fill="#111827">☀️ IPE_PV.zip</text>
        <text x="390" y="190" font-size="18px" fill="#4B5563">Solar PV readings</text>

        <rect x="670" y="130" width="290" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#EFF6FF" stroke="#93C5FD" />
        <text x="690" y="165" font-size="22px" font-weight="700" fill="#111827">🌧️ DWD + SMARD</text>
        <text x="690" y="190" font-size="18px" fill="#4B5563">Weather + market prices</text>

        <!-- Row 2: ETL Pipeline -->
        <rect x="285" y="250" width="440" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#F0FDF4" stroke="#86EFAC" />
        <text x="305" y="285" font-size="22px" font-weight="700" fill="#111827">⚙️ etl_pipeline.py</text>
        <text x="305" y="310" font-size="18px" fill="#4B5563">Ingest, align, validate, aggregate</text>

        <!-- Row 3: Processed Data -->
        <rect x="285" y="370" width="440" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#F0FDF4" stroke="#86EFAC" />
        <text x="305" y="405" font-size="22px" font-weight="700" fill="#111827">📂 data/processed/</text>
        <text x="305" y="430" font-size="18px" fill="#4B5563">Cleaned tables, features, manifest</text>

        <!-- Row 4: EDA and Training Base -->
        <rect x="60" y="490" width="330" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#FFFBEB" stroke="#FDE047" />
        <text x="80" y="525" font-size="22px" font-weight="700" fill="#111827">📊 notebooks/EDA/</text>
        <text x="80" y="550" font-size="18px" fill="#4B5563">3 notebooks: machine, solar, prices</text>

        <rect x="420" y="490" width="480" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#FAF5FF" stroke="#D8B4FE" />
        <text x="440" y="525" font-size="22px" font-weight="700" fill="#111827">🧪 training_pipeline.py</text>
        <text x="440" y="550" font-size="18px" fill="#4B5563">Time-safe experiments + MLFlow</text>

        <!-- Row 5: Training Modules -->
        <rect x="90" y="610" width="280" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#FAF5FF" stroke="#D8B4FE" />
        <text x="110" y="645" font-size="22px" font-weight="700" fill="#111827">📈 train_forecasting.py</text>
        <text x="110" y="670" font-size="18px" fill="#4B5563">15-min forecasting</text>

        <rect x="500" y="610" width="320" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#FAF5FF" stroke="#D8B4FE" />
        <text x="520" y="645" font-size="22px" font-weight="700" fill="#111827">⚠️ train_anomaly.py</text>
        <text x="520" y="670" font-size="18px" fill="#4B5563">Advisory anomaly monitoring</text>

        <rect x="850" y="610" width="280" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#FAF5FF" stroke="#D8B4FE" />
        <text x="870" y="645" font-size="22px" font-weight="700" fill="#111827">🗓️ scheduler.py</text>
        <text x="870" y="670" font-size="18px" fill="#4B5563">MILP job scheduling</text>

        <!-- Row 6: Reports Output -->
        <rect x="250" y="730" width="600" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#F0FDF4" stroke="#86EFAC" />
        <text x="270" y="765" font-size="22px" font-weight="700" fill="#111827">📄 reports/ml_short_term/application_runs/</text>
        <text x="270" y="790" font-size="18px" fill="#4B5563">Forecast, anomaly, and optimization reports</text>

        <!-- Row 7: Deployment and Apps -->
        <rect x="130" y="850" width="410" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#ECFEFF" stroke="#67E8F9" />
        <text x="150" y="885" font-size="22px" font-weight="700" fill="#111827">💻 app/streamlit_app.py</text>
        <text x="150" y="910" font-size="18px" fill="#4B5563">Public dashboard — reads reports</text>

        <rect x="560" y="850" width="460" height="80" rx="12" filter="url(#shadow)" stroke-width="2" fill="#ECFEFF" stroke="#67E8F9" />
        <text x="580" y="885" font-size="22px" font-weight="700" fill="#111827">🔌 app/main.py</text>
        <text x="580" y="910" font-size="18px" fill="#4B5563">Local FastAPI — reports + inference</text>
    </g>

    <!-- ======================= -->
    <!--    SIDEBAR / LEGEND     -->
    <!-- ======================= -->
    <rect x="1160" y="130" width="300" height="800" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" filter="url(#shadow)" />
    <text x="1180" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="28px" font-weight="800" fill="#111827">Pipeline Stages</text>

    <g font-family="system-ui, -apple-system, sans-serif">
        <!-- Legend: Data Sources -->
        <g transform="translate(1180, 210)">
            <rect x="0" y="0" width="260" height="90" rx="12" filter="url(#shadow)" stroke-width="2" fill="#EFF6FF" stroke="#93C5FD" />
            <text x="15" y="30" font-size="20px" font-weight="700" fill="#111827">🛢️ Data Sources</text>
            <text x="15" y="55" font-size="16px" fill="#4B5563">Raw industrial, solar, weather,</text>
            <text x="15" y="75" font-size="16px" fill="#4B5563">and market data</text>
        </g>

        <!-- Legend: ETL -->
        <g transform="translate(1180, 315)">
            <rect x="0" y="0" width="260" height="90" rx="12" filter="url(#shadow)" stroke-width="2" fill="#F0FDF4" stroke="#86EFAC" />
            <text x="15" y="38" font-size="20px" font-weight="700" fill="#111827">⚙️ ETL / Data Processing</text>
            <text x="15" y="65" font-size="16px" fill="#4B5563">Ingest, align, validate, prepare</text>
        </g>

        <!-- Legend: EDA -->
        <g transform="translate(1180, 420)">
            <rect x="0" y="0" width="260" height="90" rx="12" filter="url(#shadow)" stroke-width="2" fill="#FFFBEB" stroke="#FDE047" />
            <text x="15" y="38" font-size="20px" font-weight="700" fill="#111827">📊 Exploration (EDA)</text>
            <text x="15" y="65" font-size="16px" fill="#4B5563">Understand data and scenarios</text>
        </g>

        <!-- Legend: Training -->
        <g transform="translate(1180, 525)">
            <rect x="0" y="0" width="260" height="90" rx="12" filter="url(#shadow)" stroke-width="2" fill="#FAF5FF" stroke="#D8B4FE" />
            <text x="15" y="30" font-size="20px" font-weight="700" fill="#111827">🧪 Training / Modeling</text>
            <text x="15" y="55" font-size="16px" fill="#4B5563">Experiments and model training</text>
            <text x="15" y="75" font-size="16px" fill="#4B5563">(forecasting, anomaly, optim.)</text>
        </g>

        <!-- Legend: Outputs -->
        <g transform="translate(1180, 630)">
            <rect x="0" y="0" width="260" height="90" rx="12" filter="url(#shadow)" stroke-width="2" fill="#F0FDF4" stroke="#86EFAC" />
            <text x="15" y="30" font-size="20px" font-weight="700" fill="#111827">📄 Outputs / Reports</text>
            <text x="15" y="55" font-size="16px" fill="#4B5563">Forecast, anomaly, and</text>
            <text x="15" y="75" font-size="16px" fill="#4B5563">optimization reports</text>
        </g>

        <!-- Legend: Apps -->
        <g transform="translate(1180, 735)">
            <rect x="0" y="0" width="260" height="90" rx="12" filter="url(#shadow)" stroke-width="2" fill="#ECFEFF" stroke="#67E8F9" />
            <text x="15" y="38" font-size="20px" font-weight="700" fill="#111827">💻 Deployment / Apps</text>
            <text x="15" y="65" font-size="16px" fill="#4B5563">Public dashboard and local API</text>
        </g>
    </g>
</svg>