<title id="title">GreenForge AI - project architecture</title><desc id="desc">Historical industrial data flows through extraction, validation and feature processing into notebooks and an MLflow-tracked forecasting, anomaly and MILP pipeline. Stored results serve a public Streamlit dashboard or a locally containerized FastAPI dashboard stack.</desc>
